<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play vs Bot · Chess Trainer</title>
  <meta name="description" content="Play against Stockfish in your browser.">
  <meta name="theme-color" content="#0e1013">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/arrows/arrows.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/chess.js/chess.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html"><img src="img/favicon.svg" alt="" width="26" height="26"><span>Chess Trainer</span></a>
      <nav class="nav" aria-label="Main"><a href="index.html">Home</a><a href="puzzles.html">Puzzles</a><a href="openings.html">Openings</a><a href="bestmove.html">Best Move</a><a href="play.html" aria-current="page">Play</a><a href="stats.html">Stats</a></nav>
    </div>
  </header>
  <main>
    <div class="trainer">
      <div class="board-col">
        <div class="board-wrap"><div id="board" class="board"></div></div>
      </div>
      <aside class="side">
        <div class="panel" id="setup">
          <h3>New game</h3>
          <label class="field"><span>Play as</span>
            <div class="seg" role="group" aria-label="Colour" id="color-seg">
              <button data-color="w" aria-pressed="true">White</button>
              <button data-color="r" aria-pressed="false">Random</button>
              <button data-color="b" aria-pressed="false">Black</button>
            </div>
          </label>
          <label class="field"><span>Bot level</span>
            <div class="levels" id="levels"></div>
          </label>
          <p class="small muted" id="level-desc" style="min-height:2.8em">&nbsp;</p>
          <button class="btn primary" id="btn-start" style="width:100%">Start game</button>
        </div>
        <div class="panel hidden" id="game">
          <div id="status" class="status"><span class="dot"></span><span id="status-text">&nbsp;</span></div>
          <p class="small muted" id="game-meta" style="margin:10px 0 12px">&nbsp;</p>
          <div class="btn-row">
            <button class="btn" id="btn-undo">Undo</button>
            <button class="btn" id="btn-hint">Hint</button>
            <button class="btn danger" id="btn-resign">Resign</button>
          </div>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn primary hidden" id="btn-review">Review game</button>
            <button class="btn" id="btn-new">New game</button>
          </div>
        </div>
        <div class="panel hidden" id="review">
          <h3>Game review</h3>
          <div id="review-progress" class="small muted"></div>
          <div id="review-summary"></div>
          <div class="evalbar-wrap" id="review-chart"></div>
          <div class="review-list" id="review-list"></div>
          <div class="note hidden" id="review-note" style="margin-top:10px"></div>
          <button class="btn sm hidden" id="btn-review-final" style="margin-top:10px">Back to final position</button>
        </div>
        <div class="panel">
          <h3>Moves</h3>
          <div class="moves" id="moves"></div>
        </div>
      </aside>
    </div>
  </main>
  <footer class="site">Chess Trainer · Engine: Stockfish 17.1 (GPLv3) · Progress is saved in this browser only.</footer>
  <script type="module" src="js/play.js"></script>
</body>
</html>
