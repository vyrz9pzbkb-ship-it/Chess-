<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Puzzles · Chess Trainer</title>
  <meta name="description" content="Rated chess tactics puzzles.">
  <meta name="theme-color" content="#0e1013">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/arrows/arrows.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/chess.js/chess.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html"><img src="img/favicon.svg" alt="" width="26" height="26"><span>Chess Trainer</span></a>
      <nav class="nav" aria-label="Main"><a href="index.html">Home</a><a href="puzzles.html" aria-current="page">Puzzles</a><a href="openings.html">Openings</a><a href="bestmove.html">Best Move</a><a href="play.html">Play</a><a href="stats.html">Stats</a></nav>
    </div>
  </header>
  <main>
    <div class="trainer">
      <div class="board-col"><div class="board-wrap"><div id="board" class="board"></div></div></div>
      <aside class="side">
        <div class="panel">
          <div id="status" class="status"><span class="dot"></span><span id="status-text">Loading puzzles…</span></div>
          <p class="small muted" id="puzzle-meta" style="margin:10px 0 12px">&nbsp;</p>
          <div class="btn-row">
            <button class="btn" id="btn-hint" title="Using a hint counts as a miss">Hint</button>
            <button class="btn" id="btn-solution">Solution</button>
            <button class="btn" id="btn-retry">Retry</button>
          </div>
          <div class="btn-row" style="margin-top:8px">
            <button class="btn primary" id="btn-next">Next puzzle</button>
          </div>
        </div>
        <div class="panel">
          <h3>Your puzzle rating</h3>
          <div style="display:flex;align-items:baseline;gap:4px;margin-bottom:10px">
            <span id="rating" class="mono" style="font-size:2rem;font-weight:800">800</span><span id="rating-delta" class="delta"></span>
          </div>
          <dl class="kv">
            <dt>Current streak</dt><dd id="st-streak">0</dd>
            <dt>Best streak</dt><dd id="st-best">0</dd>
            <dt>Accuracy</dt><dd id="st-acc">–</dd>
            <dt>Puzzles completed</dt><dd id="st-done">0</dd>
          </dl>
        </div>
        <div class="panel">
          <label class="field" style="margin:0"><span>Theme</span>
            <select id="theme"></select>
          </label>
        </div>
      </aside>
    </div>
  </main>
  <footer class="site">Chess Trainer · Engine: Stockfish 17.1 (GPLv3) · Progress is saved in this browser only.</footer>
  <script type="module" src="js/puzzles.js"></script>
</body>
</html>
