<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Openings · Chess Trainer</title>
  <meta name="description" content="Learn and quiz beginner chess openings.">
  <meta name="theme-color" content="#0e1013">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/arrows/arrows.css">
  <link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/chess.js/chess.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html"><img src="img/favicon.svg" alt="" width="26" height="26"><span>Chess Trainer</span></a>
      <nav class="nav" aria-label="Main"><a href="index.html">Home</a><a href="puzzles.html">Puzzles</a><a href="openings.html" aria-current="page">Openings</a><a href="bestmove.html">Best Move</a><a href="play.html">Play</a><a href="stats.html">Stats</a></nav>
    </div>
  </header>
  <main>
    <div class="trainer">
      <div class="board-col">
        <div class="board-wrap"><div id="board" class="board"></div></div>
      </div>
      <aside class="side">
        <div class="panel">
          <h3 id="op-group">Opening</h3>
          <h2 id="op-name" style="margin-bottom:4px">&nbsp;</h2>
          <label class="field" style="margin:10px 0"><span>Line</span><select id="line"></select></label>
          <div class="seg" role="group" aria-label="Mode">
            <button id="mode-learn" aria-pressed="true">Learn</button>
            <button id="mode-quiz" aria-pressed="false">Quiz</button>
          </div>
        </div>
        <div class="panel">
          <div id="status" class="status info"><span class="dot"></span><span id="status-text">&nbsp;</span></div>
          <div class="note" id="note" style="margin-top:12px"></div>
          <div class="btn-row" id="learn-controls" style="margin-top:12px">
            <button class="btn" id="btn-first" aria-label="First move">&#9198;</button>
            <button class="btn" id="btn-prev" aria-label="Previous move">&#9664;</button>
            <button class="btn primary" id="btn-next" aria-label="Next move">&#9654;</button>
            <button class="btn" id="btn-last" aria-label="Last move">&#9197;</button>
          </div>
          <div class="btn-row hidden" id="quiz-controls" style="margin-top:12px">
            <button class="btn" id="btn-qhint">Show move</button>
            <button class="btn" id="btn-qrestart">Restart</button>
            <button class="btn primary" id="btn-qnext">Next line</button>
          </div>
          <div class="progress" style="margin-top:12px"><span id="progress" style="width:0"></span></div>
        </div>
        <div class="panel">
          <h3>Moves</h3>
          <div class="moves" id="moves"></div>
        </div>
        <div class="panel">
          <h3>Repertoire</h3>
          <div class="op-list" id="op-list"></div>
        </div>
      </aside>
    </div>
  </main>
  <footer class="site">Chess Trainer · Engine: Stockfish 17.1 (GPLv3) · Progress is saved in this browser only.</footer>
  <script type="module" src="js/openings.js"></script>
</body>
</html>
